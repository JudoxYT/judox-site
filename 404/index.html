<script>
(function () {
  var CHANNEL = 'imjudox';
  var DISCORD = '931673997727367218';
  var DAYS = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
  var STREAM_DAYS = [3, 6, 0]; // woensdag, zaterdag, zondag
  var HOUR = 20;

  function all(sel, fn) { document.querySelectorAll(sel).forEach(fn); }

  // Volgende stream in Nederlandse tijd.
  function nextStream() {
    var now = new Date();
    var parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Amsterdam', weekday: 'short', hour: 'numeric', hour12: false }).formatToParts(now);
    var wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(parts.find(function (p) { return p.type === 'weekday'; }).value);
    var hour = parseInt(parts.find(function (p) { return p.type === 'hour'; }).value, 10);
    for (var i = 0; i < 8; i++) {
      var d = (wd + i) % 7;
      if (STREAM_DAYS.indexOf(d) === -1) continue;
      if (i === 0 && hour >= HOUR) continue;
      if (i === 0) return 'vanavond om 20:00';
      if (i === 1) return 'morgen om 20:00';
      return DAYS[d] + ' om 20:00';
    }
    return 'woensdag om 20:00';
  }

  function setLive(live, uptime) {
    document.documentElement.classList.toggle('is-live', live);
    all('[data-live=text]', function (el) { el.textContent = live ? 'Nu live op Twitch' + (uptime ? ' · al ' + uptime : '') : 'Offline · volgende stream ' + nextStream(); });
    if (live) {
      all('[data-live=player]', function (el) {
        if (el.querySelector('iframe')) return;
        var f = document.createElement('iframe');
        f.src = 'https://player.twitch.tv/?channel=' + CHANNEL + '&parent=' + location.hostname + '&muted=true';
        f.allowFullscreen = true;
        f.title = 'Live-stream van Judox op Twitch';
        el.appendChild(f);
      });
    }
  }

  function uptimeNl(t) {
    var h = /(\d+) hour/.exec(t), m = /(\d+) minute/.exec(t);
    return (h ? h[1] + ' uur' : '') + (h && m ? ' en ' : '') + (m ? m[1] + ' min' : '');
  }

  function start() {
    all('[data-live=next]', function (el) { el.innerHTML = 'Volgende stream: <strong>' + nextStream() + '</strong>'; });
    setLive(false);

    fetch('https://decapi.me/twitch/uptime/' + CHANNEL, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) { var live = !/offline|error|not found/i.test(t); setLive(live, live ? uptimeNl(t) : ''); })
      .catch(function () { all('[data-live=text]', function (el) { el.textContent = 'Live op woensdag en in het weekend'; }); });

    fetch('https://discord.com/api/guilds/' + DISCORD + '/widget.json')
      .then(function (r) { return r.json(); })
      .then(function (w) {
        if (w.instant_invite) all('[data-discord=link]', function (el) { el.setAttribute('href', w.instant_invite); });
        if (w.presence_count) all('[data-discord=count]', function (el) { el.textContent = w.presence_count + ' mensen nu online'; });
      })
      .catch(function () {});
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
